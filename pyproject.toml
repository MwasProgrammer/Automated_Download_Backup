[build-system]
requires = ["setuptools >= 61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-download-backup"
version = "1.1.0"
authors = [
    {name = "mwas-programmer"}
]

description = "A multi-threaded, cross-platform automated download backup tool"
readme = "README.md"
requires-python = ">= 3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
"Homepage" = "https://github.com/mwas-programmer/Automated_Download_Backup"

[project.scripts]
auto-backup = "automated_download_backup.main:main"

[tool.setuptools.packages.find]
where = ["src"]